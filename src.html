<meta charset="utf-8">
<title>Paygine ЛК — прототип</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: 1:1 с макетом Figma (десктоп 1920). Сайдбар 240 + контент по центру. Светлая тема продукта, одна. */
:root {
  color-scheme: light;
  --bg: #f7f7f7;
  --surface: #ffffff;
  --text: #191c1f;
  --text-2: #717173;
  --nav: #505050;
  --muted: #adb3b6;
  --accent: #5055e8;
  --accent-soft: #eceefc;
  --accent-hover: #4045d6;
  --field: #f4f4f6;
  --line: #ececee;
  --seg: #ebebed;
  --green: #0eac41;
  --green-bar: #4ac966;
  --green-soft: #ebffef;
  --orange: #f5a524;
  --red: #f45a49;
  --grey-bar: #d4d4d4;
  --font: "Onest", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: inherit; }
svg { display: block; flex-shrink: 0; }
/* Цифры везде пропорциональные — плотные, как в макете */
body, input, select, button, .num { font-variant-numeric: proportional-nums; font-feature-settings: "tnum" 0, "pnum" 1; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* Прототип — только десктоп: горизонтальный скролл внутри обёртки, а не у body */
.viewport { height: 100%; overflow: auto; }
.app { display: flex; min-width: 1280px; min-height: 100%; }

/* ---------- Sidebar ---------- */
.sidebar { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; padding: 32px 16px 24px 24px; position: sticky; top: 0; height: 100vh; }
.logo { padding: 0 0 28px 12px; }
.logo img { width: 120px; height: 32px; display: block; }
.nav { display: flex; align-items: center; gap: 14px; height: 46px; padding: 0 14px; border-radius: 12px; color: var(--nav); font-size: 15px; line-height: 20px; width: 100%; text-align: left; transition: background .2s, color .2s; }
.nav:hover { background: rgba(255,255,255,.6); }
.nav.active { background: var(--surface); color: var(--accent); font-weight: 600; }
.nav .ic { color: #6f6f73; }
.nav.active .ic { color: var(--accent); }
.spacer { flex: 1; }

/* ---------- Main ---------- */
.main { flex: 1; min-width: 0; padding: 10px; display: flex; justify-content: center; }
.page { padding: 36px 0 48px; display: flex; flex-direction: column; gap: 32px; }
.w812 { width: 812px; } .w1000 { width: 1000px; } .w640 { width: 640px; }
.wfull { width: 100%; padding: 26px 22px 48px; }
.page-enter { }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

h1 { font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -.3px; margin: 0; }
h1 sup { font-size: 14px; font-weight: 400; color: var(--text-2); vertical-align: top; margin-left: 4px; position: relative; top: -6px; }
.h-row { display: flex; align-items: center; justify-content: space-between; }
.section-label { font-size: 24px; line-height: 22px; font-weight: 600; padding-top: 8px; margin: 0; }
.card { background: var(--surface); border-radius: 16px; }

.pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 12px; border-radius: 18px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 500; line-height: 20px; transition: background .2s, transform .15s; white-space: nowrap; }
.pill:hover { background: #e0e3fb; }
.pill:active { transform: scale(.97); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 10px 0 14px; border-radius: 18px; background: var(--surface); font-size: 14px; font-weight: 500; white-space: nowrap; position: relative; transition: box-shadow .2s; }
.chip:hover { box-shadow: 0 0 0 1px var(--line) inset; }
.chip .lbl { color: var(--text-2); font-weight: 400; }
.btn { display: inline-flex; align-items: center; justify-content: center; height: 50px; border-radius: 25px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; padding: 0 32px; transition: background .2s, transform .15s; }
.btn:hover { background: var(--accent-hover); }
.btn:active { transform: scale(.98); }
.btn.sm { height: 44px; font-size: 15px; padding: 0 20px; border-radius: 22px; }

/* dropdown */
.menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 180px; background: var(--surface); border-radius: 14px; box-shadow: 0 8px 32px rgba(25,28,31,.12); padding: 6px; z-index: 30; animation: menuIn .18s var(--ease); }
@keyframes menuIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.menu button { display: flex; width: 100%; padding: 9px 12px; border-radius: 10px; font-size: 14px; font-weight: 400; text-align: left; }
.menu button:hover { background: var(--bg); }
.menu button.on { color: var(--accent); font-weight: 500; }

/* ---------- Home ---------- */
.filters { display: flex; align-items: center; justify-content: space-between; }
.filters .left { display: flex; gap: 8px; }
.updated { display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--text-2); }
.live { width: 16px; height: 16px; border-radius: 50%; background: #e9ffee; display: grid; place-items: center; position: relative; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #4ac966; }
.live::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #4ac966; animation: ping 2s ease-out infinite; }
@keyframes ping { 0% { transform: scale(1); opacity: .6; } 80%,100% { transform: scale(2.6); opacity: 0; } }

.widgets { display: flex; flex-direction: column; gap: 16px; }
.w-row { display: flex; gap: 16px; }
.w-row > * { flex: 1 1 0; min-width: 0; }
.widget { background: var(--surface); border-radius: 16px; padding: 16px; position: relative; }
.w-label { font-size: 14px; line-height: 20px; color: var(--text-2); }
.delta { display: inline-flex; padding: 2px 8px; border-radius: 12px; background: var(--green-soft); color: var(--green); font-size: 12px; line-height: 18px; font-weight: 500; }
.delta.lg { padding: 3px 10px; font-size: 13px; }
.big, .big .num, .col .n, .tip .v { font-variant-numeric: proportional-nums; font-feature-settings: "tnum" 0, "pnum" 1; }
.big { font-size: 32px; line-height: 42px; font-weight: 500; letter-spacing: -.64px; white-space: nowrap; }
.big .dim { color: var(--muted); }
.big .small { font-size: 20px; letter-spacing: -.4px; }

/* revenue */
.rev { display: flex; gap: 8px; height: 270px; }
.rev-left { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.rev-bal { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.rev-chart { width: 487px; display: flex; flex-direction: column; }
.bars { height: 214px; display: flex; align-items: flex-end; gap: 4px; position: relative; }
.bar { flex: 1; border-radius: 4px 4px 2px 2px; background: linear-gradient(180deg, var(--accent-soft) 0%, #fff 100%); transform-origin: bottom; transform: scaleY(0); cursor: pointer; transition: background .25s; }
.bar.hl, .bars:hover .bar.hover { background: linear-gradient(180deg, var(--accent) 0%, #fff 100%); }
.bars:hover .bar.hl:not(.hover) { background: linear-gradient(180deg, #c9cbf7 0%, #fff 100%); }
.x-axis { display: flex; justify-content: space-between; padding-top: 8px; font-size: 12px; line-height: 16px; color: var(--text-2); }

.tip { position: absolute; background: var(--surface); border-radius: 10px; padding: 6px 10px; box-shadow: 0 4px 16px rgba(0,0,0,.1); pointer-events: none; white-space: nowrap; display: flex; flex-direction: column; gap: 2px; z-index: 5; transition: opacity .15s; }
.tip .t { font-size: 12px; line-height: 16px; color: var(--text-2); }
.tip .v { font-size: 13px; line-height: 18px; font-weight: 500; }

/* avg check */
.avg { display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
.avg-head { display: flex; flex-direction: column; gap: 8px; }
.avg-bal { display: flex; align-items: center; gap: 16px; }
.line-chart { position: relative; width: 366px; height: 174px; margin-top: 12px; }
.line-chart svg.plot { position: absolute; left: 0; top: 0; overflow: visible; cursor: crosshair; }
.y-labels { white-space: nowrap; position: absolute; left: 331px; top: 16px; display: flex; flex-direction: column; gap: 44px; font-size: 12px; line-height: 16px; color: var(--text-2); }
.line-path { stroke-dasharray: 400; stroke-dashoffset: 400; }
.area { opacity: 0; }
.dot { transform-box: fill-box; transform-origin: center; }

/* orders widget */
.ow { height: 372px; display: flex; flex-direction: column; justify-content: space-between; }
.ow-head { display: flex; flex-direction: column; gap: 2px; }
.cols { display: flex; gap: 12px; align-items: flex-end; padding-top: 20px; }
.col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.col .n { font-size: 13px; line-height: 18px; font-weight: 500; opacity: 0; transform: translateY(6px); }
.col .b { width: 100%; border-radius: 8px 8px 4px 4px; transform-origin: bottom; transform: scaleY(0); }
.legend { display: flex; gap: 12px; padding-top: 8px; font-size: 12px; line-height: 16px; color: var(--text-2); text-align: center; }
.legend span { flex: 1; }

/* reveal sequence */
.rv { opacity: 0; transform: translateY(16px) scale(.985); }
.anim .rv { animation: rv .7s var(--ease) both; animation-delay: var(--d, 0ms); }
@keyframes rv { to { opacity: 1; transform: none; } }
.anim .bar { transition: transform .9s var(--ease), background .25s; transition-delay: var(--d, 0ms), 0ms; transform: scaleY(1); }
.anim .col .b { transition: transform 1s var(--ease); transition-delay: var(--d, 0ms); transform: scaleY(1); }
.anim .col .n { transition: opacity .4s ease, transform .4s var(--ease); transition-delay: var(--d, 0ms); opacity: 1; transform: none; }
.anim .line-path { transition: stroke-dashoffset 1.4s var(--ease) .55s; stroke-dashoffset: 0; }
.anim .area { transition: opacity .9s ease 1.1s; opacity: 1; }
.pop { opacity: 0; transform: scale(.6); }
.anim .pop { animation: pop .5s var(--ease) both; animation-delay: var(--d, 0ms); }
@keyframes pop { to { opacity: 1; transform: none; } }
.anim .delta { animation: pop .5s var(--ease) both; animation-delay: var(--d, 900ms); }
.delta.wait { opacity: 0; }

.list-card { padding: 6px 16px; display: flex; flex-direction: column; }
.list-card.row { flex-direction: row; }
.li { display: flex; align-items: center; gap: 12px; padding: 10px 0; flex: 1; font-size: 14px; font-weight: 500; line-height: 20px; border-radius: 12px; transition: transform .2s var(--ease); cursor: pointer; }
.li:hover { transform: translateX(3px); }
.round { width: 40px; height: 40px; border-radius: 20px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; transition: background .2s; }
.li:hover .round { background: #e0e3fb; }

/* ---------- Payments (orders list) ---------- */
.tabs-title { display: flex; gap: 20px; align-items: baseline; }
.tabs-title button { font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -.3px; color: var(--muted); }
.tabs-title button.on { color: var(--text); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.status-bar { display: flex; gap: 4px; padding: 16px; height: 36px; align-items: center; }
.status-bar i { height: 4px; border-radius: 2px; }
@keyframes grow { from { transform: scaleX(0); } }
.table { padding: 0 0 8px; }
.tr { display: grid; grid-template-columns: 112px 104px 110px 150px 210px 112px 1fr 40px; column-gap: 20px; padding: 0 16px; align-items: start; }
.th { height: 48px; align-items: center; font-size: 13px; color: var(--text-2); }
.th .sort { display: inline-flex; align-items: center; gap: 4px; }
.td-row { padding-top: 10px; padding-bottom: 10px; min-height: 64px; cursor: pointer; border-radius: 12px; transition: background .15s; }
.td-row:hover { background: #f9f9fb; }
.td-row > div { min-width: 0; }
.id-link { color: var(--accent); font-size: 14px; line-height: 20px; }
.c-main { font-size: 14px; line-height: 20px; }
.c-sub { font-size: 12px; line-height: 16px; color: var(--text-2); margin-top: 2px; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.right { text-align: right; justify-content: flex-end; }
.st { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; white-space: nowrap; }
.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--green-bar)); }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-in { }
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } }

/* ---------- Order card ---------- */
.back { width: 24px; height: 24px; color: var(--text); border-radius: 6px; }
.order-title { display: flex; align-items: center; gap: 10px; }
.copy-btn { color: #9a9aa0; border-radius: 6px; padding: 2px; transition: color .2s; }
.copy-btn:hover { color: var(--accent); }
.amount-card { position: relative; overflow: hidden; padding: 16px; height: 150px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; }
.amount-card::after { content: ""; position: absolute; right: -60px; bottom: -90px; width: 360px; height: 260px; background: radial-gradient(closest-side, rgba(74,201,102,.45), rgba(74,201,102,0)); pointer-events: none; }
.amount-card .tags { position: absolute; right: 16px; top: 16px; display: flex; gap: 8px; z-index: 1; }
.tag { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 16px; background: rgba(255,255,255,.85); font-size: 13px; font-weight: 500; }
.tag.ok { color: var(--green); }
.tag.ok::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--green-bar); }
.amt { font-size: 32px; line-height: 42px; font-weight: 600; letter-spacing: -.64px; }
.amt .dim { color: var(--muted); font-size: 22px; font-weight: 500; }
.amt .rub { font-size: 22px; }
.seg { display: inline-flex; background: var(--seg); border-radius: 20px; padding: 3px; position: relative; height: 40px; }
.seg button { position: relative; z-index: 1; padding: 0 22px; font-size: 13px; color: var(--text-2); border-radius: 17px; min-width: 120px; transition: color .25s; white-space: nowrap; }
.seg button.on { color: var(--text); font-weight: 500; }
.seg button .cnt { color: var(--muted); margin-left: 4px; }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; background: var(--surface); border-radius: 17px; box-shadow: 0 1px 4px rgba(0,0,0,.08); transition: left .35s var(--ease), width .35s var(--ease); }
.ops { padding: 6px 13px 10px; }
.ops .tr2 { display: grid; column-gap: 16px; align-items: start; padding: 9px 0; }
.ops .head { color: var(--text-2); font-size: 13px; padding: 10px 0 6px; }
.fields { padding: 8px 13px 14px; display: flex; flex-direction: column; }
.field { padding: 10px 0; display: flex; flex-direction: column; gap: 10px; }
.field .l { font-size: 13px; line-height: 16px; color: var(--text-2); }
.field .v { font-size: 13.5px; line-height: 18px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.field .v .st { font-size: 13.5px; }
.sub-h { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 18px; padding: 12px 0 4px; }
.tab-panel { }

/* ---------- Overlay / drawer / modal ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(240,240,242,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); animation: fade .3s ease both; }
.overlay.out { animation: fade .25s ease reverse both; }
@keyframes fade { from { opacity: 0; } }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; background: var(--bg); border-radius: 24px 0 0 24px; box-shadow: -8px 0 40px rgba(25,28,31,.08); display: flex; flex-direction: column; animation: slideIn .45s var(--ease) both; }
.drawer.out { animation: slideOut .3s ease-in both; }
@keyframes slideIn { from { transform: translateX(100%); } }
@keyframes slideOut { to { transform: translateX(100%); } }
.drawer .scroll { flex: 1; overflow: auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 16px; }
.drawer .foot { padding: 0 24px 28px; }
.drawer .foot .btn { width: 100%; }
.x-btn { width: 32px; height: 32px; display: grid; place-items: center; margin-left: -8px; border-radius: 10px; transition: background .2s; }
.x-btn:hover { background: rgba(0,0,0,.05); }
.modal { position: fixed; z-index: 41; left: 50%; top: 38px; transform: translateX(-50%); width: 1164px; height: calc(100vh - 160px); max-height: 900px; background: var(--surface); border-radius: 24px; box-shadow: 0 16px 60px rgba(25,28,31,.12); display: flex; flex-direction: column; padding: 18px 32px 28px; animation: modalIn .45s var(--ease) both; }
.modal.out { animation: modalOut .25s ease-in both; }
@keyframes modalIn { from { opacity: 0; transform: translate(-50%, 24px) scale(.98); } }
@keyframes modalOut { to { opacity: 0; transform: translate(-50%, 16px) scale(.98); } }

/* ---------- New order ---------- */
.sector-sel { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; line-height: 30px; font-weight: 500; color: var(--muted); margin-top: 8px; position: relative; }
.sector-sel:hover { color: #969da1; }
.form-card { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.form-card h3 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.inp { height: 56px; border-radius: 12px; background: var(--field); border: 0; padding: 0 14px; font-size: 14px; width: 100%; outline: none; transition: box-shadow .2s, background .2s; }
.inp::placeholder { color: #8a8a90; font-size: 13px; }
.inp:focus { box-shadow: 0 0 0 2px var(--accent) inset; background: #fff; }
.inp.huge { height: 72px; font-size: 28px; font-weight: 500; letter-spacing: -.56px; }
.inp.huge::placeholder { font-size: 28px; color: #8a8a90; font-weight: 400; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.toggle-card { display: flex; align-items: center; gap: 12px; padding: 13px 13px 13px 13px; }
.toggle-card .t { flex: 1; font-size: 15px; font-weight: 500; }
.switch { width: 40px; height: 24px; border-radius: 12px; background: #d6d6da; position: relative; transition: background .25s; flex-shrink: 0; }
.switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .3s var(--ease); }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(16px); }
.center { display: flex; justify-content: center; }
.items-layout { display: flex; gap: 16px; align-items: flex-start; }
.items-left { width: 340px; flex-shrink: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.items-left .seg { width: 100%; }
.items-left .seg button { flex: 1; min-width: 0; padding: 0 8px; }
.items-left .inp { height: 52px; }
.items-right { flex: 1; min-width: 0; padding: 16px 16px 16px; display: flex; flex-direction: column; min-height: 390px; }
.pos-grid { display: grid; grid-template-columns: minmax(200px, 1fr) 160px 120px 108px 116px 24px; column-gap: 8px; align-items: center; }
.pos-head { font-size: 13px; color: var(--text-2); height: 36px; }
.pos-row { margin-bottom: 8px; }
.pos-row .inp { height: 44px; border-radius: 10px; font-size: 14px; }
.pos-row .inp.r { text-align: right; }
.sel { position: relative; }
.sel select { appearance: none; -webkit-appearance: none; height: 44px; width: 100%; border-radius: 10px; background: var(--field); border: 0; padding: 0 32px 0 12px; font-size: 14px; outline: none; cursor: pointer; }
.sel svg { position: absolute; right: 12px; top: 14px; pointer-events: none; }
.stepper { height: 44px; border-radius: 10px; background: var(--field); display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.stepper button { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; }
.stepper button:hover { background: rgba(0,0,0,.05); }
.stepper button:disabled { opacity: .35; cursor: default; background: none; }
.stepper .q { font-size: 14px; min-width: 20px; text-align: center; }
.pos-sum { text-align: right; font-weight: 600; font-size: 14px; }
.pos-sum .dim { color: var(--muted); font-weight: 400; }
.trash { color: #8a8a90; border-radius: 6px; width: 24px; height: 24px; display: grid; place-items: center; transition: color .2s; }
.trash:hover { color: var(--red); }
.pos-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; display: flex; align-items: center; gap: 16px; }
.add-pos { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 14px; font-weight: 500; }
.add-pos:hover { color: var(--accent-hover); }
.totals { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--text-2); }
.totals b { font-size: 17px; color: var(--text); font-weight: 600; padding-left: 12px; border-left: 1px solid var(--line); }
.float-bar { position: fixed; left: calc(50% + 120px); bottom: 28px; transform: translateX(-50%); z-index: 42; background: var(--surface); border-radius: 30px; box-shadow: 0 8px 32px rgba(25,28,31,.12); display: flex; align-items: center; gap: 28px; padding: 10px 16px; height: 60px; animation: barIn .5s var(--ease) both; }
@keyframes barIn { from { opacity: 0; transform: translate(-50%, 20px); } }
.float-bar .fi { display: flex; align-items: center; gap: 14px; font-size: 18px; font-weight: 600; white-space: nowrap; }
.float-bar .fi .cnt { color: var(--muted); }
.float-bar .rb { width: 24px; height: 24px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; transition: background .2s, transform .2s; }
.float-bar .rb:hover { background: var(--accent-soft); color: var(--accent); }
.float-bar .fi.on .rb { background: var(--accent-soft); color: var(--accent); }
.float-bar .div { width: 1px; height: 20px; background: var(--line); margin: 0 -10px; }

/* ---------- Sectors / staff ---------- */
.list { display: flex; flex-direction: column; gap: 16px; }
.list-item { background: var(--surface); border-radius: 16px; padding: 14px 16px; min-height: 72px; display: flex; align-items: center; gap: 16px; cursor: pointer; text-align: left; width: 100%; transition: box-shadow .2s, transform .2s var(--ease); }
.list-item:hover { box-shadow: 0 0 0 2px #dfe1fb inset; }
.list-item.sel-on { box-shadow: 0 0 0 2px #c9cbf7 inset; }
.list-item .nm { font-size: 14px; line-height: 20px; font-weight: 500; }
.list-item .sb { font-size: 13px; line-height: 18px; color: var(--text-2); margin-top: 2px; }
.list-item .grow { flex: 1; min-width: 0; }
.staff .nm { font-size: 16px; line-height: 22px; }
.role-ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.role-ic.view { background: var(--green-soft); color: var(--green); }
.acc { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 56px; font-size: 15px; font-weight: 500; width: 100%; }
.acc svg { color: var(--accent); transition: transform .3s var(--ease); }
.acc.open svg { transform: rotate(180deg); }
.acc-body { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 10px; animation: pageIn .3s var(--ease) both; }
.notif { padding: 6px 16px; }
.notif .r { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; font-size: 14px; }
.notif .r button { color: var(--accent); border-radius: 6px; }
.h-sub { font-size: 16px; font-weight: 600; margin: 8px 0 -4px; }

/* ---------- Prototype controls (вне интерфейса) ---------- */
.proto { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; align-items: center; gap: 4px; background: #1d1f24; color: #fff; padding: 5px; border-radius: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.25); font-size: 12px; }
.proto .lab { padding: 0 8px 0 10px; color: #a3a6ae; }
.proto button { padding: 7px 10px; border-radius: 10px; color: #d4d6dc; transition: background .2s; }
.proto button:hover { background: rgba(255,255,255,.08); }
.proto button.on { background: #fff; color: #1d1f24; font-weight: 500; }
.toast { position: fixed; left: calc(50% + 120px); top: 24px; transform: translateX(-50%); z-index: 70; background: #1d1f24; color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 14px; box-shadow: 0 8px 28px rgba(0,0,0,.2); animation: toastIn .35s var(--ease) both; }
.toast.out { animation: toastIn .25s ease reverse both; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px); } }

@media (prefers-reduced-motion: reduce) {

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const easeOut = t => 1 - Math.pow(1 - t, 4);

function countUp(el, to, { dur = 1500, delay = 0, decimals = 0, onFrac } = {}) {
  if (reduce) { el.textContent = fmt(to, 0); onFrac && onFrac(to); return; }
  const start = performance.now() + delay;
  el.textContent = '0';
  const tick = now => {
    if (!el.isConnected) return;
    const t = Math.min(1, Math.max(0, (now - start) / dur));
    const v = to * easeOut(t);
    el.textContent = fmt(Math.floor(v), 0);
    onFrac && onFrac(v);
    if (t < 1) requestAnimationFrame(tick); else { el.textContent = fmt(Math.floor(to), 0); onFrac && onFrac(to); }
  };
  requestAnimationFrame(tick);
}

let toastT;
function toast(text) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t);
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 260); }, 1800);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); } catch (e) {}
  toast('Скопировано');
}

function go(route) {
  if (location.hash.slice(1) === route) render(); else location.hash = route;

function render() {
  const h = location.hash.slice(1);
  S.route = ROUTES.includes(h) ? h : 'home';

  $('#app').innerHTML = `

/* делегирование кликов */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go); return; }
  const t = e.target.closest('[data-toast]'); if (t) { toast(t.dataset.toast); return; }
  const c = e.target.closest('[data-copy]'); if (c) { e.stopPropagation(); copy(c.dataset.copy); return; }
  if (!e.target.closest('.menu') && !e.target.closest('[data-menu]')) $$('.menu').forEach(m => m.remove());
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $$('.menu').forEach(m => m.remove()); closeLayer(); } });

function dropdown(anchor, options, current, onPick) {
  $$('.menu').forEach(m => m.remove());
  const m = document.createElement('div');
  m.className = 'menu';
  m.innerHTML = options.map(o => `<button class="${o === current ? 'on' : ''}">${o}</button>`).join('');
  anchor.appendChild(m);
  $$('button', m).forEach((b, i) => b.addEventListener('click', ev => { ev.stopPropagation(); m.remove(); onPick(options[i]); }));

  const p = document.createElement('div');
  p.className = 'proto';

}

function periodData() {
  const p = PERIODS[S.homePeriod];
  const sk = SECTORS_K[S.homeSector];
  const jitter = (i, s) => s === 0 ? 1 : 0.7 + 0.6 * Math.abs(Math.sin(i * 1.7 + s * 3.1));
  const bars = BARS.map((h, i) => Math.max(5, Math.min(214, h * jitter(i, p.seed))));
  const maxI = bars.indexOf(Math.max(...bars));
  bars[maxI] = 214;
  const line = LINE.map(([x, y], i) => [x, p.seed === 0 ? y : Math.max(1, Math.min(43, y + 14 * Math.sin(i * 1.3 + p.seed)))]);
  return { ...p, rev: p.rev * sk, total: Math.round(p.total * sk), orders: p.orders.map(v => Math.round(v * sk)), bars, maxI, line };
}

function segmented(el, active, onChange) {
  const btns = $$('button', el), thumb = $('.thumb', el);
  const place = (i, instant) => {
    btns.forEach((b, j) => b.classList.toggle('on', i === j));
    if (instant) thumb.style.transition = 'none';
    thumb.style.left = btns[i].offsetLeft + 'px';
    thumb.style.width = btns[i].offsetWidth + 'px';
    if (instant) requestAnimationFrame(() => thumb.style.transition = '');
  };
  btns.forEach((b, i) => b.addEventListener('click', () => { place(i); onChange(i); }));
  requestAnimationFrame(() => place(active, true));
  document.fonts && document.fonts.ready.then(() => {
    if (!el.isConnected) return;
    const i = btns.findIndex(b => b.classList.contains('on'));
    place(i < 0 ? active : i, true);
  });
}

    <div class="card form-card"><h3>Данные плательщика</h3><div class="grid2"><input class="inp" placeholder="Номер телефона"><input class="inp" placeholder="Эл. почта"><input class="inp" placeholder="Номер договора"><input class="inp" placeholder="Номер счета"></div></div>
    <div class="card form-card"><h3>Дополнительные данные</h3><div class="grid2">${['ФИО', 'Имя', 'Фамилия', 'Наименование банка', 'Страна', 'Регион', 'Город', 'Адрес', 'Индекс'].map(p => `<input class="inp" placeholder="${p}">`).join('')}</div></div>`;
  if (v === 'float') body = `<div class="card form-card">${baseFields()}</div>`;

  main.innerHTML = `
  <div class="page w640 page-enter" style="gap:16px">
    <div style="display:flex;flex-direction:column;gap:12px">${backBtn}<h1>Новый заказ</h1></div>
    <div style="margin-top:-12px">${sectorSel()}</div>
    ${segHtml}
    ${body}
    <div class="center" style="padding-top:${v === 'extra' ? 0 : 30}px"><button class="btn" style="width:340px" id="create">Создать заказ</button></div>
  </div>`;
  wireNewOrder(main);
  if (v === 'float') renderFloatBar(); else $$('.float-bar').forEach(b => b.remove());
}

function NewOrderItems(main) {
  main.innerHTML = `
  <div class="page wfull page-enter" style="gap:16px">
    <h1>Новый заказ</h1>
    <div style="margin-top:-12px">${sectorSel()}</div>
    <div class="items-layout">
      <div class="card items-left">
        <div style="font-size:13px;color:var(--text-2)">Основное</div>
        <div class="seg" id="nseg"><span class="thumb"></span><button>Без позиций</button><button>С позициями</button></div>
        <div style="height:1px;background:var(--line)"></div>
        ${baseFields(false)}
        <div style="display:flex;align-items:center;gap:12px;padding-top:6px"><span class="round" style="width:34px;height:34px">${ic('clock', 18)}</span><span style="flex:1;font-size:14px;font-weight:500">Регулярные платежи</span><button class="switch ${S.regular ? 'on' : ''}" data-switch aria-label="Регулярные платежи"></button></div>
      </div>
      <div class="card items-right" id="pos">${positionsHtml()}</div>
    </div>
  </div>`;
  wireNewOrder(main);
  wirePositions($('#pos'));
}

function positionsHtml(withButton = true) {
  const total = S.items.reduce((a, it) => a + it.price * it.qty, 0);
  const n = S.items.length;
  const word = n % 10 === 1 && n % 100 !== 11 ? 'позиция' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'позиции' : 'позиций';
  return `
    <div class="pos-grid pos-head"><span>Позиции</span><span>НДС</span><span class="right" style="display:flex">Цена, ₽</span><span style="text-align:center">Кол-во</span><span class="right" style="display:flex">Сумма, ₽</span><span></span></div>
    <div class="pos-list">${S.items.map((it, i) => `
      <div class="pos-grid pos-row" data-i="${i}">
        <input class="inp" value="${it.name.replace(/"/g, '&quot;')}" placeholder="Название товара или услуги" data-f="name">
        <div class="sel"><select data-f="vat">${VATS.map(v => `<option ${v === it.vat ? 'selected' : ''}>${v}</option>`).join('')}</select>${ic('down', 16)}</div>
        <input class="inp r num" value="${fmt(it.price, 2)}" data-f="price" inputmode="decimal">
        <div class="stepper"><button data-q="-1" ${it.qty <= 1 ? 'disabled' : ''} aria-label="Меньше">${ic('minus', 16)}</button><span class="q num">${it.qty}</span><button data-q="1" style="color:var(--accent)" aria-label="Больше">${ic('plus', 16)}</button></div>
        <div class="pos-sum num" data-sum>${fmt(Math.floor(it.price * it.qty))}<span class="dim">,${String(Math.round((it.price * it.qty % 1) * 100)).padStart(2, '0')}</span></div>
        <button class="trash" data-del aria-label="Удалить">${ic('trash', 17)}</button>
      </div>`).join('')}</div>
    <div class="pos-foot">
      <button class="add-pos" data-add>${ic('plus', 18)}Добавить позицию</button>
      <div class="totals"><span>${n} ${word}</span><b class="num" id="ptotal">${fmt(total)} ₽</b></div>
      ${withButton ? `<button class="btn sm" data-create>Создать заказ</button>` : ''}
    </div>`;
}
function wirePositions(box, withButton = true, after) {
  const rerender = () => { box.innerHTML = positionsHtml(withButton); wirePositions(box, withButton, after); after && after(); };
  $$('.pos-row', box).forEach(row => {
    const i = +row.dataset.i, it = S.items[i];
    $$('[data-q]', row).forEach(b => b.addEventListener('click', () => { it.qty = Math.max(1, it.qty + +b.dataset.q); rerender(); }));
    $('[data-del]', row).addEventListener('click', () => { row.style.transition = 'opacity .2s, transform .2s'; row.style.opacity = 0; row.style.transform = 'translateX(12px)'; setTimeout(() => { S.items.splice(i, 1); rerender(); }, 180); });
    $('[data-f="name"]', row).addEventListener('input', e => it.name = e.target.value);
    $('[data-f="vat"]', row).addEventListener('change', e => it.vat = e.target.value);
    $('[data-f="price"]', row).addEventListener('change', e => { const v = parseFloat(e.target.value.replace(/\s/g, '').replace(',', '.')); it.price = isNaN(v) ? 0 : v; rerender(); });
  });
  $('[data-add]', box).addEventListener('click', () => { S.items.push({ name: '', vat: '20%', price: 0, qty: 1 }); rerender(); const last = $$('.pos-row [data-f="name"]', box).at(-1); last && last.focus(); });
  const cb = $('[data-create]', box); cb && cb.addEventListener('click', createOrder);
}
function createOrder() { closeLayer(); toast('Заказ создан, ссылка на оплату скопирована'); }

function wireNewOrder(main) {
  const seg = $('#nseg', main);
  if (seg) segmented(seg, S.newMode === 'items' ? 1 : 0, i => {
    const m = i ? 'items' : 'none';
    if (S.newVariant === 'tabs') { setTimeout(() => { S.newMode = m; NewOrder(main); }, 220); }
    else toast(i ? 'Позиции — в варианте «Табы»' : 'Без позиций');
  });
  $$('[data-switch]', main).forEach(s => s.addEventListener('click', () => { S.regular = !S.regular; s.classList.toggle('on', S.regular); toast(S.regular ? 'Регулярные платежи включены' : 'Регулярные платежи выключены'); }));
  const sel = $('[data-menu="nsec"]', main);
  sel && sel.addEventListener('click', e => dropdown(sel, ['7925 · ИП Иванова Мария Петровна', '7923 · ИП Смирнов Денис Сергеевич', '5654 · ИП Иванов Иван Иванович'], $('#nsecV').textContent, v => $('#nsecV').textContent = v));
  const c = $('#create', main); c && c.addEventListener('click', createOrder);
  const sum = $('#sum', main);
  sum && sum.addEventListener('blur', () => { const v = parseFloat(sum.value.replace(/\s/g, '').replace(',', '.')); if (!isNaN(v)) sum.value = fmt(v, 2) + ' ₽'; });
  sum && sum.addEventListener('focus', () => { sum.value = sum.value.replace(' ₽', ''); });
}

function renderFloatBar() {
  $$('.float-bar').forEach(b => b.remove());
  if (S.route !== 'new-order' || S.newVariant !== 'float') return;
  const bar = document.createElement('div');
  bar.className = 'float-bar';
  const n = S.items.length;
  bar.innerHTML = `
    <div class="fi ${S.regular ? 'on' : ''}">Регулярные платежи <button class="rb" data-fr aria-label="Регулярные платежи">${ic(S.regular ? 'x' : 'plus', 14, 2)}</button></div>
    <div class="fi ${S.floatItems ? 'on' : ''}">Позиции${S.floatItems ? ` <span class="cnt">${n}</span>` : ''} <button class="rb" data-fp aria-label="Позиции">${ic(S.floatItems ? 'x' : 'plus', 14, 2)}</button></div>
    ${S.floatItems ? `<span class="div"></span><button class="btn sm" data-fc>Создать заказ</button>` : ''}`;
  document.body.appendChild(bar);
  $('[data-fr]', bar).addEventListener('click', () => { S.regular = !S.regular; toast(S.regular ? 'Регулярные платежи добавлены' : 'Регулярные платежи убраны'); renderFloatBar(); });
  $('[data-fp]', bar).addEventListener('click', () => {
    if (S.floatItems) { S.floatItems = false; closeLayer(); renderFloatBar(); }
    else { S.floatItems = true; openItemsModal(); renderFloatBar(); }
  });
  const fc = $('[data-fc]', bar); fc && fc.addEventListener('click', createOrder);
}
function openItemsModal() {
  const m = openLayer(`<button class="x-btn" data-close aria-label="Закрыть">${ic('x', 22)}</button><div id="mpos" style="flex:1;display:flex;flex-direction:column;margin-top:20px"></div>`, 'modal');
  const box = $('#mpos', m);
  box.innerHTML = positionsHtml(false);
  wirePositions(box, false, () => renderFloatBar());
  $('[data-close]', m).addEventListener('click', () => { S.floatItems = false; });
  $('.overlay').addEventListener('click', () => { S.floatItems = false; });
}

}
